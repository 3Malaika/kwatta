name: Build Android APK

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create basic index.html for Capacitor
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Kwatta</title>
            <style>
              body { 
                font-family: system-ui, -apple-system, sans-serif; 
                margin: 0; 
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: linear-gradient(135deg, #00431E 0%, #A53C00 100%);
                color: white;
              }
              .container {
                text-align: center;
                max-width: 400px;
              }
              h1 { font-size: 2.5em; margin-bottom: 0.5em; }
              p { font-size: 1.1em; line-height: 1.6; opacity: 0.9; }
              .btn {
                display: inline-block;
                margin-top: 2em;
                padding: 15px 40px;
                background: white;
                color: #00431E;
                text-decoration: none;
                border-radius: 8px;
                font-weight: bold;
                font-size: 1.1em;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🌍 Kwatta</h1>
              <p>Application de signalement de dépôts sauvages à Yaoundé</p>
              <p><small>Pour utiliser l'application, veuillez d'abord déployer le backend.</small></p>
              <a href="#" class="btn" onclick="alert('Configurez l\'URL du backend dans capacitor.config.ts'); return false;">
                En savoir plus
              </a>
            </div>
          </body>
          </html>
          EOF

      - name: Update capacitor.config.ts for build
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kwatta.app',
            appName: 'Kwatta',
            webDir: 'www',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || echo "Android already added"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "✅ APK built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the APK from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ This is a placeholder app. To use the full Kwatta app:" >> $GITHUB_STEP_SUMMARY
          echo "1. Deploy the backend (see BACKEND_DEPLOY.md)" >> $GITHUB_STEP_SUMMARY
          echo "2. Configure the backend URL in capacitor.config.ts" >> $GITHUB_STEP_SUMMARY
          echo "3. Push a new commit to rebuild with the backend connection" >> $GITHUB_STEP_SUMMARY